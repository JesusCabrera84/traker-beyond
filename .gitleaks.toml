title = "geminis-labs-web-page"

[extend]
useDefault = true

[allowlist]
description = "Build artifacts, vendor paths, and docs with intentional placeholder tokens"
paths = [
	'''(?:^|/)node_modules/''',
	'''(?:^|/)\.svelte-kit/''',
	'''(?:^|/)build/''',
	'''(?:^|/)coverage/''',
	'''(?:^|/)dist/''',
	'''(?:^|/)docs/architecture/modules/''',
	'''(?:^|/)RECAPTCHA_SETUP\.md$''',
]
regexes = [
	'''tu_[a-z_]+''',
	'''example\.com''',
	'''6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI''',
	'''03AGdBq24''',
	'''inv_abc123''',
	'''abc123def456''',
]
