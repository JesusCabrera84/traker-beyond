name: Deploy Tracker Web to EC2

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-ec2-test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          name: id_rsa
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for deployment
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tracker-web:latest
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save tracker-web:latest | gzip > tracker-web.tar.gz

      - name: Copy Docker image to EC2
        run: |
          echo "Copiando imagen Docker al servidor..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa tracker-web.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }}:/tmp/
          echo "Copia completada."

      - name: Verify file transfer
        run: |
          echo "Verificando que el archivo se copió correctamente..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }} << 'EOF'
            if [ -f /tmp/tracker-web.tar.gz ]; then
              echo "✅ Archivo encontrado: /tmp/tracker-web.tar.gz"
              echo "Tamaño del archivo: $(du -h /tmp/tracker-web.tar.gz)"
              echo "Espacio disponible en /tmp: $(df -h /tmp | tail -1)"
            else
              echo "❌ Error: No se encontró el archivo /tmp/tracker-web.tar.gz"
              exit 1
            fi
          EOF

      - name: Deploy to EC2 Test Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }} << 'EOF'
            set -e

            echo "=== Detener contenedor anterior ==="
            docker stop tracker-web-test || true
            docker rm tracker-web-test || true

            echo "=== Limpiando espacio en disco ==="
            docker container prune -f || true
            docker image prune -f || true
            docker volume prune -f || true

            echo "Espacio disponible en /tmp:"
            df -h /tmp

            echo "=== Cargar nueva imagen ==="
            cd /tmp
            if [ -f tracker-web.tar.gz ]; then
              echo "Cargando imagen Docker..."
              docker load < tracker-web.tar.gz

              echo "=== Verificar imagen cargada ==="
              docker images | grep tracker-web || echo "Advertencia: No se encontró la imagen tracker-web"

              echo "=== Ejecutar nuevo contenedor ==="
              docker run -d \
                --name tracker-web-test \
                --restart unless-stopped \
                -p 3330:3330 \
                -e NODE_ENV=production \
                tracker-web:latest

              echo "=== Verificar contenedor ==="
              docker ps | grep tracker-web-test

              echo "=== Limpiar archivos temporales ==="
              rm -f tracker-web.tar.gz
              find /tmp -name "tracker-web*.tar.gz" -mtime +1 -delete || true

              echo "=== Deployment completado exitosamente ==="
            else
              echo "Error: No se encontró el archivo tracker-web.tar.gz"
              exit 1
            fi
          EOF
